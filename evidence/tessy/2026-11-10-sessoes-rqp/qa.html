<!doctype html><meta charset="utf-8"><title>QA viewport RQP</title><pre id="result">aguardando</pre><iframe id="mobile" width="375" height="900" src="/posts/2026-11-10-uma-sessao-nao-deve-prender-outra.html"></iframe><iframe id="desktop" width="1440" height="900" src="/posts/2026-11-10-uma-sessao-nao-deve-prender-outra.html"></iframe><script>
let n=0; for (const id of ['mobile','desktop']) document.getElementById(id).addEventListener('load',()=>{if(++n!==2)return;document.getElementById('result').textContent=JSON.stringify(['mobile','desktop'].map(id=>{const d=document.getElementById(id).contentDocument;const s=d.createElement('style');s.textContent='::-webkit-scrollbar { display:none }';d.head.append(s);return {id,viewport:d.documentElement.clientWidth,scroll:d.documentElement.scrollWidth,title:d.querySelector('h1').textContent}}))});
</script>
