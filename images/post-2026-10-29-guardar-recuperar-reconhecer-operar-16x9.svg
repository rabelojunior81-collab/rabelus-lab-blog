<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" style="max-width:100%;height:auto" role="img" aria-labelledby="title desc">
<title id="title">Arquitetura proposta: guardar, recuperar, reconhecer e operar</title>
<desc id="desc">Pessoas entram por identidade e a aplicação verifica permissões antes de acessar catálogo e objetos. Backup independente protege o conjunto. Inferência pessoal usa runtime e autorização próprios. Docker Linux, deploy e telemetria sustentam a operação; Proxmox é opção de base do Homelab. Proposta conceitual, sem implantação.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8fb054"/></marker><marker id="fire" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ff6b35"/></marker></defs>
<rect width="1920" height="1080" fill="#080c05"/>
<style>text{font-family:Inter,Arial,sans-serif;fill:#f3f8e9}.eyebrow{font-size:20px;font-weight:700;letter-spacing:3px;fill:#8fb054}.heading{font-size:29px;font-weight:700}.line{font-size:22px;fill:#cde0ab}.small{font-size:19px;fill:#cde0ab}.edge{fill:none;stroke:#8fb054;stroke-width:3;marker-end:url(#arrow)}.optional{fill:none;stroke:#ff6b35;stroke-width:3;stroke-dasharray:10 8;marker-end:url(#fire)}.box{fill:#11190c;stroke:#45552a;stroke-width:2}.accent{stroke:#8fb054}.orange{stroke:#ff6b35}</style>
