<rect x="64" y="756" width="704" height="152" class="box "/>
<text x="88" y="797" class="heading">BASE E DEPLOY</text>
<text x="88" y="834" class="line">Docker Engine Linux + Compose ou PaaS</text>
<text x="88" y="865" class="line">Swarm / k3s quando o requisito justificar</text>
<text x="88" y="896" class="line">Proxmox: opção de base do Homelab</text>
<rect x="832" y="756" width="400" height="152" class="box "/>
<text x="856" y="797" class="heading">OBSERVABILIDADE</text>
<text x="856" y="834" class="line">Saúde, métricas e logs</text>
<text x="856" y="865" class="line">Alertas e recuperação</text>
<text x="856" y="896" class="line">Retenção e acesso próprios</text>
<rect x="1296" y="756" width="560" height="152" class="box "/>
<text x="1320" y="797" class="heading">CRITÉRIO DE CONFIANÇA</text>
<text x="1320" y="834" class="line">Restaurar em outro ambiente</text>
<text x="1320" y="865" class="line">Conferir integridade e relações</text>
<text x="1320" y="896" class="line">Medir perda aceitável e tempo de retorno</text>
<path d="M64 724 H1232" fill="none" stroke="#45552a" stroke-width="2"/>
<text x="64" y="711" class="small">A base operacional sustenta os serviços; não substitui backup nem autorização.</text>
