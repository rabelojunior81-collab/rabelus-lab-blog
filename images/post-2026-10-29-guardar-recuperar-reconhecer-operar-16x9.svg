<text x="104" y="73" class="eyebrow">RABELUS LAB</text>
<text x="64" y="137" font-size="45" font-weight="800">Guardar, recuperar, reconhecer e operar</text>
<text x="64" y="180" class="line">Quatro responsabilidades conectadas · proposta conceitual · pesquisa de 29/10/2026</text>
<path d="M64 204 H1856" stroke="#45552a" stroke-width="2"/>

<rect x="64" y="250" width="320" height="130" class="box "/>
<text x="88" y="291" class="heading">PESSOAS</text>
<text x="88" y="328" class="line">Conta individual</text>
<text x="88" y="359" class="line">Acesso ao projeto</text>
<rect x="448" y="250" width="320" height="155" class="box accent"/>
<text x="472" y="291" class="heading">IDENTIDADE</text>
<text x="472" y="328" class="line">OIDC / passkeys</text>
<text x="472" y="359" class="line">Face: opção a validar</text>
<text x="472" y="390" class="line">Sessão própria do app</text>
<rect x="832" y="250" width="400" height="130" class="box accent"/>
<text x="856" y="291" class="heading">APLICAÇÃO</text>
<text x="856" y="328" class="line">Permissões por pessoa e ativo</text>
<text x="856" y="359" class="line">Confirmação dos uploads</text>
<rect x="1296" y="250" width="560" height="130" class="box orange"/>
<text x="1320" y="291" class="heading">PROVEDORES DE LINGUAGEM</text>
<text x="1320" y="328" class="line">ChatGPT: plano individual, se elegível</text>
<text x="1320" y="359" class="line">OpenCode: API e condições próprias</text>
<path d="M384 315 H448" class="edge"/>
<path d="M768 315 H832" class="edge"/>
<rect x="64" y="470" width="320" height="166" class="box orange"/>
<text x="88" y="511" class="heading">PLANO PESSOAL</text>
<text x="88" y="548" class="line">Runtime e consentimento</text>
<text x="88" y="579" class="line">sob controle do usuário</text>
<text x="88" y="610" class="line">Opção separada do login</text>
<rect x="448" y="470" width="320" height="166" class="box "/>
<text x="472" y="511" class="heading">CATÁLOGO</text>
<text x="472" y="548" class="line">Banco de metadados</text>
<text x="472" y="579" class="line">Projetos e vínculos</text>
<text x="472" y="610" class="line">Referências dos objetos</text>
<rect x="832" y="470" width="400" height="166" class="box accent"/>
<text x="856" y="511" class="heading">OBJETOS DE MÍDIA</text>
<text x="856" y="548" class="line">S3 / compatível</text>
<text x="856" y="579" class="line">Originais e derivados</text>
<text x="856" y="610" class="line">Lab, VPS ou gerenciado</text>
<rect x="1296" y="470" width="560" height="166" class="box accent"/>
<text x="1320" y="511" class="heading">BACKUP RECUPERÁVEL</text>
<text x="1320" y="548" class="line">Objetos + catálogo + chaves de recuperação</text>
<text x="1320" y="579" class="line">Original + 2 backups independentes</text>
<text x="1320" y="610" class="line">Cópia externa e offline / imutável</text>
