<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc"><title id="title">Anika: referências recuperadas, patrimônio preservado</title><desc id="desc">Onze referências atuais mais cinquenta e uma históricas resultam em sessenta e duas imagens. Escrita versionada 14 para 15, campos não afetados preservados e sessenta e duas entregas HTTP200. Diagrama separado da captura real.</desc><metadata>Tessy Fenix / Codex; 2026-09-30T15:32:42.828Z; fonte SHA256 15e2ec9dc259826cdbd12f2392de68284e5ec7e0c05e166d23fc77229b3a416a</metadata><rect width="1200" height="430" fill="#080c05"/><g font-family="Arial,sans-serif" fill="#f3f8e9"><text x="42" y="51" font-size="29" font-weight="700">ANIKA · recuperar a referência preserva a história</text><text x="42" y="81" font-size="16" fill="#a8bb89">30 set 2026 · prova de dado vivo e entrega HTTP · anotação separada</text><rect x="42" y="119" width="320" height="145" fill="#182410" stroke="#8fb054"/><text x="202" y="190" font-size="55" text-anchor="middle" font-weight="700">11</text><text x="202" y="235" font-size="16" text-anchor="middle">REFERÊNCIAS ATUAIS</text><rect x="439" y="119" width="320" height="145" fill="#182410" stroke="#8fb054"/><text x="599" y="190" font-size="55" text-anchor="middle" font-weight="700">51</text><text x="599" y="235" font-size="16" text-anchor="middle">HISTÓRICAS OMITIDAS</text><rect x="836" y="119" width="320" height="145" fill="#182410" stroke="#8fb054"/><text x="996" y="190" font-size="55" text-anchor="middle" font-weight="700">62</text><text x="996" y="235" font-size="16" text-anchor="middle">GALERIA RECUPERADA</text><text x="395" y="202" font-size="34" text-anchor="middle">+</text><text x="792" y="202" font-size="34" text-anchor="middle">=</text><text x="42" y="309" font-size="20">CAS 14 → 15 · 62 HTTP 200 · demais campos preservados · replay sem escrita</text><text x="42" y="346" font-size="16" fill="#d2dfc1">Limite: recuperar a galeria não corrige o filtro de referências automáticas nem atualiza o SDK.</text><text x="42" y="391" font-size="13" fill="#a8bb89">Fonte: recibo da aplicação #100 · SHA256 15e2ec9dc259826cdbd12f2392de68284e5ec7e0c05e166d23fc77229b3a416a</text></g></svg>
